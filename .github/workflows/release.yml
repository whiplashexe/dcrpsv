name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  companion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: windows, goarch: amd64, ext: .exe}
          - {goos: linux,   goarch: amd64, ext: ""}
          - {goos: linux,   goarch: arm64, ext: ""}
          - {goos: darwin,  goarch: amd64, ext: ""}
          - {goos: darwin,  goarch: arm64, ext: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out=ps5-discord-rpc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/companion
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ps5-discord-rpc-*

  # UNTESTED: written from the SDK README, never run in CI. Failure here does
  # not block the companion binaries.
  payload:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wget unzip
      - name: Install ps5-payload-sdk
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -d /opt ps5-payload-sdk.zip
      - name: Build payload
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: make -C payload
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload/ps5-rpc.elf

  publish:
    needs: [companion, payload]
    if: ${{ !cancelled() && needs.companion.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
